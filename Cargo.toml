[package]
name = "suko_solver"
version = "0.1.0"
edition = "2018"

[lib]
name = "suko_solver"
path = "src/lib.rs"

[dependencies]
rand = "0.8"
actix-web = "4.4"
actix-cors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true