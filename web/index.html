<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="High-performance Sudoku solver with ultra-fast algorithm, manual input, and random puzzle generation">
    <meta name="keywords" content="sudoku, solver, puzzle, game, algorithm">
    <title>Sudoku Solver | Ultra-Fast Algorithm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description"
            content="High-performance Sudoku solver with ultra-fast algorithm, manual input, and random puzzle generation">
        <meta name="keywords" content="sudoku, solver, puzzle, game, algorithm">
        <title>Sudoku Solver | Ultra-Fast Algorithm</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Comic+Neue:wght@300;400;700&family=Patrick+Hand&display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>

<body>
    <!-- SVG Filters for Hand-Drawn Effect -->
    <svg style="display: none;">
        <defs>
            <filter id="rough-paper">
                <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise" />
                <feDiffuseLighting in="noise" lighting-color="#fff9f0" surfaceScale="2">
                    <feDistantLight azimuth="45" elevation="60" />
                </feDiffuseLighting>
            </filter>
            <filter id="pencil-texture">
                <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="5" stitchTiles="stitch" />
                <feColorMatrix type="saturate" values="0" />
                <feComponentTransfer>
                    <feFuncR type="linear" slope="0.5" />
                    <feFuncG type="linear" slope="0.5" />
                    <feFuncB type="linear" slope="0.5" />
                </feComponentTransfer>
                <feBlend mode="multiply" in2="SourceGraphic" />
            </filter>
        </defs>
    </svg>

    <div class="notebook-page">
        <div class="holes"></div>

        <header>
            <div class="doodle-title">
                <h1>Sudoku</h1>
                <span class="scribble-underline"></span>
            </div>
            <p class="handwritten-subtitle">My Puzzle Notebook ✏️</p>
        </header>

        <main>
            <div class="game-container">
                <div class="sketch-border">
                    <div id="sudoku-grid" class="sudoku-grid">
                        <!-- Grid cells generated by JS -->
                    </div>
                </div>

                <div class="notebook-sidebar">
                    <div class="doodle-mascot">
                        <div id="mascot-drawing" class="mascot-idle">
                            (•_•)
                            <br>
                            <span style="font-size: 0.8em;">/||\</span>
                        </div>
                        <div class="speech-bubble" id="status-message">
                            Let's solve some puzzles!
                        </div>
                    </div>

                    <div class="controls-area">
                        <button id="generate-btn" class="sketch-btn">
                            <span>New Puzzle</span>
                            <svg class="btn-scribble" viewBox="0 0 100 10">
                                <path d="M0,5 Q50,10 100,5" fill="none" stroke="currentColor" stroke-width="2" />
                            </svg>
                        </button>
                        <button id="solve-btn" class="sketch-btn primary">
                            <span>Solve It!</span>
                            <svg class="btn-scribble" viewBox="0 0 100 10">
                                <path d="M0,5 Q50,0 100,5" fill="none" stroke="currentColor" stroke-width="2" />
                            </svg>
                        </button>
                        <button id="clear-btn" class="sketch-btn danger">
                            <span>Erase All</span>
                            <svg class="btn-scribble" viewBox="0 0 100 10">
                                <path d="M0,5 Q50,10 100,5" fill="none" stroke="currentColor" stroke-width="2" />
                            </svg>
                        </button>
                    </div>

                    <div class="stats-doodle">
                        <h3>Stats</h3>
                        <div class="stat-row">
                            <span>Time:</span>
                            <span id="timing-display" class="highlight-marker">--</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p class="doodle-footer">
                ~ powered by rust & coffee ~
            </p>
        </footer>
    </div>

    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="pencil-loading">
            <div class="pencil"></div>
            <div class="drawing-line"></div>
        </div>
        <p>Thinking...</p>
    </div>

    <script src="app.js"></script>
</body>

</html>
